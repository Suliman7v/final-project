version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: todo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: todo-app
    ports:
      - "7540:7540"
    environment:
      - TODO_PORT=7540
      - TODO_DATABASE_URL=postgres://postgres:password@postgres:5432/todo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    #volumes:
     # - ./:/app

volumes:
  postgres_data: